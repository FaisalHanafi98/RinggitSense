name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ringgitsense
          POSTGRES_PASSWORD: ringgitsense
          POSTGRES_DB: ringgitsense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ringgitsense -d ringgitsense_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ringgitsense:ringgitsense@localhost:5432/ringgitsense_test
      SECRET_KEY: ci-test-secret-key
      CLERK_DOMAIN: test.clerk.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint with ruff
        run: ruff check backend/

      - name: Type check with mypy
        run: mypy backend/src/

      - name: Run tests with coverage
        working-directory: backend
        run: pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
