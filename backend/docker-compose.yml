# RinggitSense Docker Compose
# NOTE: Start Docker Desktop before running docker-compose up

services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ringgitsense-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ringgitsense
      POSTGRES_PASSWORD: ringgitsense
      POSTGRES_DB: ringgitsense
    ports:
      - "5432:5432"
    volumes:
      - ringgitsense_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ringgitsense -d ringgitsense"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ringgitsense

  # Redis (caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: ringgitsense-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ringgitsense

  # FastAPI Backend
  api:
    build: .
    container_name: ringgitsense-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ringgitsense:ringgitsense@postgres:5432/ringgitsense
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - ringgitsense

volumes:
  ringgitsense_postgres_data:

networks:
  ringgitsense:
    driver: bridge
